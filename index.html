<script>

/* ===================== 🧰 OUTILS ===================== */
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOISC=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function norm(s){return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();}
function sameName(a,b){a=norm(a);b=norm(b);return !!a&&!!b&&(a===b||a.startsWith(b+" ")||a.startsWith(b+"."));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function slug(n){return norm(n).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");}
function obj(x){return x&&typeof x==="object"&&!Array.isArray(x)?x:{};}
function liste2(x){
  if(x==null||x==="") return [];
  if(Array.isArray(x)) return x.flatMap(liste2);
  if(typeof x==="object") return x.nom?[String(x.nom)]:(x.texte?[String(x.texte)]:[]);
  const s=String(x).trim(); return s?[s]:[];
}
function liste(x){return liste2(x).flatMap(s=>s.split(/\s*(?:,|;|&|\/|\bet\b)\s*/i)).map(s=>s.trim()).filter(Boolean);}
function has(x,nom){return liste(x).some(n=>sameName(n,nom));}
function pad(n){return String(n).padStart(2,"0");}
function isoJour(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseD(d){
  if(d==null||d==="") return null;
  if(typeof d==="number") return new Date(d);
  const s=String(d);
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\D+(\d{1,2})[h:](\d{2}))?/);
  if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1],+(m[4]||12),+(m[5]||0));}
  const t=new Date(s); return isNaN(t)?null:t;
}
function tms(d){const t=parseD(d);return t?t.getTime():0;}
function fDate(d){const t=parseD(d);if(!t)return "";return "le "+pad(t.getDate())+"/"+pad(t.getMonth()+1)+(t.getFullYear()!==2026?"/"+t.getFullYear():"")+" à "+pad(t.getHours())+"h"+pad(t.getMinutes());}
function jourP(c){return String(c.date).split("-").map(Number);}
function dateP(c){const [y,m,d]=jourP(c);return new Date(y,m-1,d,21,10);}
function lundiApres(c){const [y,m,d]=jourP(c);const j=new Date(y,m-1,d).getDay();return new Date(y,m-1,d+(((8-j)%7)||7));}
function debutJour(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function numJ(n){return n===1?"1er":String(n);}
function dCourte(c){const d=dateP(c);return numJ(d.getDate())+" "+MOISC[d.getMonth()]+(d.getFullYear()!==2026?" "+d.getFullYear():"");}
function dLongue(c){const d=dateP(c);return JOURS[d.getDay()]+" "+numJ(d.getDate())+" "+MOIS[d.getMonth()]+(d.getFullYear()!==2026?" "+d.getFullYear():"");}
function couleur(n){let h=0;for(const ch of String(n))h=(h*31+ch.codePointAt(0))%360;return "linear-gradient(135deg,hsl("+h+",70%,55%),hsl("+((h+50)%360)+",65%,38%))";}
/* 🏳️ Drapeaux en image (Windows affiche sinon "FR") */
function drap(f){
  const cp=Array.from(String(f||"")).map(c=>c.codePointAt(0)).filter(x=>x>=0x1F1E6&&x<=0x1F1FF);
  let h="";
  for(let i=0;i+1<cp.length;i+=2){const cc=String.fromCharCode(cp[i]-0x1F1E6+97,cp[i+1]-0x1F1E6+97);h+=`<img class="drap" src="https://flagcdn.com/w40/${cc}.png" alt="${cc.toUpperCase()}" title="${cc.toUpperCase()}">`;}
  return h;
}

function CALv(){
  const auto=(S&&S.officiel&&Array.isArray(S.officiel.calendrier))?S.officiel.calendrier:[];
  return CAL_BASE.map(c=>{
    const a=auto.find(x=>x&&+x.num===c.num);
    if(!a) return c;
    const r=Object.assign({},c);
    if(typeof a.date==="string"&&/^\d{4}-\d{2}-\d{2}/.test(a.date)) r.date=a.date.slice(0,10);
    if(a.ok===true) r.ok=true;
    const inv=liste2(a.invites); if(inv.length) r.invites=inv;
    if(typeof a.titre==="string"&&a.titre.trim()) r.titre=a.titre.trim();
    return r;
  });
}
function vedette(){const now=new Date(),cal=CALv();return cal.find(c=>now<lundiApres(c))||cal[cal.length-1];}
function primeDeDate(d){const t=parseD(d),cal=CALv();if(!t)return 1;const c=cal.find(x=>t<lundiApres(x));return (c||cal[cal.length-1]).num;}
function primeInfo(num){
  num=+num;
  const b=PRIMES_BASE[num]||{};
  const auto=(S&&S.officiel&&Array.isArray(S.officiel.primes))?S.officiel.primes:[];
  const a=auto.find(x=>x&&+x.num===num)||{};
  const r={num};
  ["nomines","sauve","elimine","abandon","immunise","top3","finalistes","gagnant","invites","wiki"].forEach(k=>{const A=liste2(a[k]);r[k]=A.length?A:liste2(b[k]);});
  const ca=Array.isArray(a.chansons)?a.chansons.filter(x=>x&&typeof x==="object"):[];
  r.chansons=ca.length?ca:(b.chansons||[]);
  return r;
}
function invitesDe(num){const p=primeInfo(num);const c=CALv().find(x=>x.num===+num)||{};return p.invites.length?p.invites:liste2(c.invites);}
function chansonsDe(nom,num){
  const out=[];
  primeInfo(num).chansons.forEach(ch=>{const el=liste(ch.eleves);if(el.some(n=>sameName(n,nom)))out.push({titre:ch.titre||"",artiste:ch.artiste||"",avec:el.filter(n=>!sameName(n,nom))});});
  return out;
}
function sortiAu(nom){for(const c of CALv()){const p=primeInfo(c.num);if(has(p.elimine,nom)||has(p.abandon,nom))return c.num;}return 0;}

function statutTexteOfficiel(nom){
  const st=S.officiel&&S.officiel.statuts;
  if(Array.isArray(st)){const f=st.find(x=>x&&sameName(x.nom||x.prenom||"",nom));return f?String(f.statut||f.status||""):"";}
  if(st&&typeof st==="object"){const k=Object.keys(st).find(k=>sameName(k,nom));return k?String(st[k]||""):"";}
  return "";
}
function statutAuto(nom){
  const txt=statutTexteOfficiel(nom);
  if(/élimin|elimin|abandon|gagn|vainqu|finalist/i.test(txt)) return txt;
  for(const c of CALv()){
    const p=primeInfo(c.num);
    if(has(p.gagnant,nom)) return "Gagnant(e) 🏆";
    if(has(p.elimine,nom)) return "Éliminé(e) au prime "+c.num;
    if(has(p.abandon,nom)) return "Abandon (prime "+c.num+")";
  }
  const V=vedette().num,pv=primeInfo(V),pp=V>1?primeInfo(V-1):primeInfo(V);
  if(has(pv.finalistes,nom)) return "Finaliste ✨";
  if(has(pv.sauve,nom)) return "Sauvé(e) 🙌";
  if(has(pv.nomines,nom)) return "Nominé(e) ⚠️";
  if(has(pv.immunise,nom)||(V>1&&has(pp.immunise,nom))) return "Immunisé(e) 🛡️";
  return txt||"En compétition";
}
function statut(nom){const e=S.eleves[nom];return (e&&e.statut)||statutAuto(nom);}
function classeStatut(s){
  s=norm(s);
  if(/elimin|abandon|quitte|parti/.test(s)) return "elim";
  if(/gagn|vainq/.test(s)) return "win";
  if(/finalist/.test(s)) return "fin";
  if(/nomin|nomme/.test(s)) return "nom";
  if(/immun/.test(s)) return "imm";
  if(/sauve/.test(s)) return "sauve";
  return "ok";
}
function badge(st){return `<span class="badge b-${classeStatut(st)}">${esc(st)}</span>`;}

function save(){try{localStorage.setItem(CLE,JSON.stringify(S));}catch(e){alert("⚠️ La mémoire du navigateur est pleine ! Retire quelques photos pour pouvoir enregistrer.");}}
function normCom(c){
  if(c==null) return null;
  if(typeof c!=="object") c={t:String(c)};
  const t=c.t??c.texte??c.text??c.txt??c.msg??"";
  const pd=parseD(c.d??c.date??c.ts??null);
  const o={t:String(t),d:pd?pd.toISOString():null};
  if(c.m) o.m=c.m;
  if(+c.prime>=1) o.prime=+c.prime;
  return o;
}
function migrer(){
  if(!S||typeof S!=="object"||Array.isArray(S)) S={};
  S.officiel=obj(S.officiel);
  S.photos=obj(S.photos);
  S.profs=obj(S.profs);
  S.primes=obj(S.primes);
  S.eleves=obj(S.eleves);
  if(!Array.isArray(S.ordre)) S.ordre=[];
  Object.keys(S.primes).forEach(k=>{
    const num=parseInt(String(k).replace(/\D+/g,""),10);
    if(!(num>=1)) return;
    const p=obj(S.primes[k]);
    p.avis=typeof p.avis==="string"?p.avis:"";
    p.best=typeof p.best==="string"?p.best:"";
    p.eleves=obj(p.eleves);
    Object.keys(p.eleves).forEach(n=>{
      let pe=p.eleves[n]; if(typeof pe==="number") pe={note:pe}; pe=obj(pe);
      pe.note=+pe.note||0;
      pe.coms=(Array.isArray(pe.coms)?pe.coms:[]).map(normCom).filter(c=>c&&c.t.trim());
      pe.coms.forEach(c=>{c.prime=num;});
      p.eleves[n]=pe;
    });
    if(String(num)!==String(k)&&!S.primes[num]){delete S.primes[k];S.primes[num]=p;}else S.primes[k]=p;
  });
  ELEVES.forEach(n=>{
    const e=obj(S.eleves[n]);
    e.fav=!!e.fav; e.note=+e.note||0; e.statut=typeof e.statut==="string"?e.statut:"";
    const coms=Array.isArray(e.coms)?e.coms:[];
    ["com","commentaire","comment","avis"].forEach(f=>{if(typeof e[f]==="string"){if(e[f].trim())coms.push({t:e[f],d:null});delete e[f];}});
    e.coms=coms.map(normCom).filter(c=>c&&c.t.trim());
    e.coms.forEach(c=>{if(!(c.prime>=1)) c.prime=c.d?primeDeDate(c.d):1;});
    S.eleves[n]=e;
  });
  Object.keys(S.profs).forEach(k=>{
    let v=S.profs[k];
    if(typeof v==="number") v={note:v,avis:""}; else if(typeof v==="string") v={note:0,avis:v};
    v=obj(v); v.note=+v.note||0; if(typeof v.avis!=="string") v.avis="";
    if(!v.avis&&Array.isArray(v.coms)&&v.coms.length) v.avis=v.coms.map(normCom).filter(Boolean).map(c=>c.t).join("\n");
    let cible=k;
    if(!PROFS.some(p=>p.nom===k)){const w=norm(k).split(/\s+/)[0];const pr=w.length>=3?PROFS.find(p=>norm(p.nom).split(/\s+/).includes(w)):null;if(pr&&!S.profs[pr.nom])cible=pr.nom;}
    if(cible!==k) delete S.profs[k];
    S.profs[cible]=v;
  });
  syncOrdre();
  S.v=5;
}
function primeData(num){const k=String(num);if(!S.primes[k])S.primes[k]={avis:"",best:"",eleves:{}};return S.primes[k];}
function noteP(num,nom){const p=S.primes[String(num)];return (p&&p.eleves&&p.eleves[nom]&&+p.eleves[nom].note)||0;}
function syncOrdre(){
  S.ordre=S.ordre.filter((n,i,a)=>ELEVES.includes(n)&&S.eleves[n]&&S.eleves[n].fav&&a.indexOf(n)===i);
  ELEVES.forEach(n=>{if(S.eleves[n]&&S.eleves[n].fav&&!S.ordre.includes(n))S.ordre.push(n);});
}
function moyenne(nom){const ns=Object.keys(S.primes).filter(k=>/^\d+$/.test(k)).map(k=>noteP(k,nom)).filter(x=>x>0);return {moy:ns.length?ns.reduce((a,b)=>a+b,0)/ns.length:0,nb:ns.length};}
function fmtMoy(m){return m.nb?`⭐ ${m.moy.toFixed(1).replace(".",",")}/5 sur ${m.nb} prime${m.nb>1?"s":""}`:"Pas encore noté";}

function getComs(key){
  const parts=key.split(":");
  if(parts[0]==="e") return S.eleves[parts[1]].coms;
  const num=parts[1],nom=parts.slice(2).join(":");
  const pd=primeData(num);
  if(!pd.eleves[nom]) pd.eleves[nom]={note:0,coms:[]};
  if(!Array.isArray(pd.eleves[nom].coms)) pd.eleves[nom].coms=[];
  return pd.eleves[nom].coms;
}
function tousComs(nom){
  const L=[];
  (S.eleves[nom].coms||[]).forEach((c,i)=>L.push({key:"e:"+nom,i,c,p:+c.prime||1}));
  Object.keys(S.primes).forEach(k=>{
    if(!/^\d+$/.test(k)) return;
    const pe=S.primes[k].eleves&&S.primes[k].eleves[nom];
    if(pe&&Array.isArray(pe.coms)) pe.coms.forEach((c,i)=>L.push({key:"p:"+k+":"+nom,i,c,p:+k}));
  });
  return L;
}
function addCom(key,t,prime){getComs(key).push({t,d:new Date().toISOString(),prime});save();}
function ajouterCom(nom){

function editCom(key,i){
  const arr=getComs(key),c=arr[i]; if(!c) return;
  const v=prompt("✏️ Modifier ton commentaire :",c.t);
  if(v===null) return;

  else{c.t=v.trim();c.m=new Date().toISOString();}
  save();refresh();toast("✏️ Commentaire modifié");
}
function delCom(key,i){
  const arr=getComs(key); if(!arr[i]) return;
  if(!confirm("🗑️ Supprimer ce commentaire ?")) return;
  arr.splice(i,1);save();refresh();toast("🗑️ Commentaire supprimé");
}
function moveCom(key,i){
  const arr=getComs(key),c=arr[i]; if(!c) return;
  const parts=key.split(":"),max=CALv().length;
  const cur=parts[0]==="e"?(+c.prime||1):+parts[1];
  const v=prompt("🔁 Ce commentaire concerne quel prime ? (de 1 à "+max+")",cur);
  if(v===null) return;
  const n=parseInt(v,10);
  if(!(n>=1&&n<=max)){alert("Numéro de prime invalide 😕");return;}
  if(parts[0]==="e") c.prime=n;
  else if(n!==cur){arr.splice(i,1);c.prime=n;getComs("p:"+n+":"+parts.slice(2).join(":")).push(c);}
  save();refresh();toast("🔁 Rangé dans le prime "+n);
}
function timeline(nom){
  const L=tousComs(nom);
  if(!L.length) return `<p class="mut">Pas encore de commentaire sur ${nom}. Écris le premier ! ✍️</p>`;
  const G={};
  L.forEach(x=>{(G[x.p]=G[x.p]||[]).push(x);});
  const nums=Object.keys(G).map(Number).sort((a,b)=>a-b);
  if(ORDRE_COMS==="desc") nums.reverse();
  const cal=CALv();
  let h=`<div class="tlbar"><b>📜 Tout l’historique (${L.length})</b><button class="btn sec petit" onclick="ORDRE_COMS=(ORDRE_COMS==='asc'?'desc':'asc');refresh()">${ORDRE_COMS==="asc"?"⬇️ Du plus ancien au plus récent":"⬆️ Du plus récent au plus ancien"}</button></div><div class="tl">`;
  nums.forEach(n=>{
    const g=G[n].sort((a,b)=>tms(a.c.d)-tms(b.c.d));
    if(ORDRE_COMS==="desc") g.reverse();
    const c=cal.find(x=>x.num===n),note=noteP(n,nom);
    h+=`<div class="tlg"><div class="tlh"><span class="pbadge">🎤 Prime ${n}</span><span class="mut sm">${c?dLongue(c):""}</span>${note?`<span class="or" title="Ma note de ce prime">${"★".repeat(note)}${"☆".repeat(5-note)}</span>`:""}</div>`;
    g.forEach(x=>{
      h+=`<div class="com"><div class="cmeta"><span class="pbadge sm">Prime ${n}</span>${x.c.d?`<span class="mut">${fDate(x.c.d)}</span>`:`<span class="mut">date inconnue</span>`}${x.c.m?`<span class="mut">· modifié</span>`:""}</div><div class="ctxt">${esc(x.c.t).replace(/\n/g,"<br>")}</div><div class="cact"><button onclick="editCom('${x.key}',${x.i})">✏️ Modifier</button><button onclick="moveCom('${x.key}',${x.i})">🔁 Changer de prime</button><button onclick="delCom('${x.key}',${x.i})">🗑️ Supprimer</button></div></div>`;

  return `<div class="carte${cs==="elim"?" dehors":""}${e.fav?" fav":""}">

    <div class="cl" onclick="openFiche('${nom}')">${avatar(nom)}<div><div class="nom">${nom}${drap(b.drapeau)}</div><div class="mut sm">${b.age?b.age+" ans · ":""}${esc(b.ville||"")}</div></div></div>
    ${badge(st)}
    <div class="chs">${ch.length?ch.map(x=>`🎵 <b>${esc(x.titre)}</b> <span class="mut">– ${esc(x.artiste)}${x.avec.length?" · avec "+esc(x.avec.join(", ")):""}</span>`).join("<br>"):`<span class="mut">🎵 Chanson du prime ${SEL} : pas encore connue</span>`}</div>
    <div class="pnote"><span class="mut sm">Ma note · Prime ${SEL}</span>${etoiles(noteP(SEL,nom),`setPNote(${SEL},'${nom}',#)`)}</div>
    <button class="btn sec coms" onclick="openFiche('${nom}',true)">💬 Mes commentaires (${n}) · voir la fiche</button>
  </div>`;
}
function pageEleves(){
  const V=vedette();
  let h=boiteVedette(V)+boiteActus();
  h+=`<div class="ctrl"><label class="sm">🎤 Je note le :
      <select id="primeSel" onchange="SEL=+this.value;SEL_MANUEL=(SEL!==vedette().num);refresh()">${CALv().map(c=>`<option value="${c.num}" ${c.num===SEL?"selected":""}>Prime ${c.num} · ${dCourte(c)}${c.num===V.num?" ⭐":""}</option>`).join("")}</select></label>
    <div class="filtres">${[["tous","👥 Tous"],["fav","⭐ Préférés"],["course","🎯 En course"]].map(([k,l])=>`<button class="chip${FILTRE===k?" on":""}" onclick="FILTRE='${k}';refresh()">${l}</button>`).join("")}</div></div>`;
  let L=ELEVES.slice();
  if(FILTRE==="fav") L=L.filter(n=>S.eleves[n].fav);
  if(FILTRE==="course") L=L.filter(n=>classeStatut(statut(n))!=="elim");
  const dehors=n=>classeStatut(statut(n))==="elim"?1:0;
  L.sort((a,b)=>dehors(a)-dehors(b));
  h+=L.length?`<div class="grille">${L.map(n=>carte(n)).join("")}</div>`:`<div class="vide">Aucun élève ici pour l’instant 🙂</div>`;
  return h;
}

/* ===================== 📺 PAGE PRIMES ===================== */
function recapOfficiel(c,p){
  const inv=invitesDe(c.num);
  const L=[["🎶 Invités",inv],["🛡️ Immunisé(e)",p.immunise],["🏅 Top 3 des évaluations",p.top3],["⚠️ Nominé(e)s",p.nomines],["🙌 Sauvé(e)",p.sauve],["❌ Éliminé(e)",p.elimine],["🚪 Abandon",p.abandon],["✨ Finalistes",p.finalistes],["🏆 Gagnant(e)",p.gagnant]];
  const lignes=L.filter(x=>liste2(x[1]).length).map(x=>`<div><span class="mut">${x[0]} :</span> <b>${liste2(x[1]).map(esc).join(", ")}</b></div>`);
  let h=`<div class="offi"><h4>📋 Officiel</h4>${lignes.length?lignes.join(""):`<div class="mut">Rien d’officiel pour l’instant.</div>`}`;
  if(p.chansons.length) h+=`<h4 style="margin-top:10px">🎵 Les chansons</h4><ul class="chl">${p.chansons.map(ch=>`<li><b>${esc(liste2(ch.eleves).join(" & "))}</b> — ${esc(ch.titre||"")}${ch.artiste?` <span class="mut">(${esc(ch.artiste)})</span>`:""}</li>`).join("")}</ul>`;
  if(p.wiki.length) h+=`<details class="wiki" ${OPEN["w"+c.num]?"open":""} ontoggle="OPEN['w${c.num}']=this.open"><summary>📖 Le résumé (Wikipédia)</summary>${p.wiki.map(x=>`<p>${esc(x)}</p>`).join("")}<p class="mut sm">Source : Wikipédia, licence CC BY-SA</p></details>`;
  return h+`</div>`;
}
function monRecap(c,pd,moy){
  const presents=ELEVES.filter(n=>{const s=sortiAu(n);return !(s&&s<c.num);});
  return `<div class="mien"><h4>📝 Mon récap</h4>
    <label class="sm">🏆 Mon meilleur élève de la soirée :
      <select onchange="setBest(${c.num},this.value)"><option value="">—</option>${presents.map(n=>`<option value="${n}" ${pd.best===n?"selected":""}>${n}</option>`).join("")}</select></label>
    <textarea id="avis${c.num}" placeholder="Mon avis général sur ce prime…" oninput="setAvis(${c.num},this.value)">${esc(pd.avis||"")}</textarea>
    ${moy?`<div class="sm">📊 Moyenne de mes notes : <b>${moy.toFixed(1).replace(".",",")}/5</b></div>`:""}
    <div class="nl">${presents.map(n=>{const ch=chansonsDe(n,c.num);const nc=tousComs(n).filter(x=>x.p===c.num).length;return `<div class="nlr"><span class="lien nm" onclick="openFiche('${n}')">${avatar(n,"mini")} ${n}</span><span class="mut sm chx">${ch.length?"🎵 "+ch.map(x=>esc(x.titre)).join(" / "):""}</span>${etoiles(noteP(c.num,n),`setPNote(${c.num},'${n}',#)`)}<span class="sm lien" title="Mes commentaires de ce prime" onclick="openFiche('${n}',true,${c.num})">💬 ${nc}</span></div>`;}).join("")}</div>
  </div>`;
}
function pagePrimes(){
  const V=vedette().num,now=new Date();
  let h=`<h2 class="titre">📺 Les primes</h2><p class="mut sm">Touche un prime pour l’ouvrir : infos officielles (mises à jour toutes seules), ton avis et tes notes.</p>`;
  CALv().forEach(c=>{
    const p=primeInfo(c.num),pd=S.primes[String(c.num)]||{avis:"",best:"",eleves:{}};
    const passe=now>=dateP(c);
    const ouvert=(OPEN["p"+c.num]!==undefined)?OPEN["p"+c.num]:(c.num===V);
    const etat=c.num===V?`<span class="tag or">⭐ en ce moment</span>`:(passe?`<span class="tag ok">✅ passé</span>`:`<span class="tag">⏳ à venir</span>`);
    const ns=ELEVES.map(n=>noteP(c.num,n)).filter(x=>x>0);
    const moy=ns.length?ns.reduce((a,b)=>a+b,0)/ns.length:0;
    h+=`<details class="bloc prime" ${ouvert?"open":""} ontoggle="OPEN['p${c.num}']=this.open"><summary>🎤 <b>Prime ${c.num}</b>${c.titre?" · "+esc(c.titre):""} <span class="mut sm">— ${dLongue(c)}${c.ok?"":" (date prévue)"}</span> ${etat}${pd.best?` <span class="tag">🏆 ${esc(pd.best)}</span>`:""}</summary><div class="pbody">${recapOfficiel(c,p)}${monRecap(c,pd,moy)}</div></details>`;
  });
  return h;
}

/* ===================== 🏆 PAGE MON CLASSEMENT ===================== */
function pageClassement(){
  syncOrdre();
  const L=S.ordre;
  let h=`<h2 class="titre">🏆 Mon classement</h2>`;
  if(!L.length) return h+`<div class="vide">☆ Touche l’étoile d’un élève (sur sa carte ou dans sa fiche) pour l’ajouter à tes préférés : il apparaîtra ici !</div>`;
  h+=`<div class="podium">`;
  [1,0,2].forEach(i=>{const n=L[i];if(!n)return;h+=`<div class="pod p${i+1}" onclick="openFiche('${n}')">${avatar(n,"big")}<div class="nom">${["🥇","🥈","🥉"][i]} ${n}</div><div class="mut sm">${fmtMoy(moyenne(n))}</div><div class="marche">${i+1}</div></div>`;});
  h+=`</div><div class="ctrl"><span class="mut sm">⬆️⬇️ Range tes préférés comme tu veux</span><button class="btn sec" onclick="trierMoy()">📊 Trier par moyenne</button></div><div class="liste">`;
  L.forEach((n,i)=>{const b=BIOS[n]||{};h+=`<div class="row"><span class="rang">${i+1}</span><span class="lien" onclick="openFiche('${n}')">${avatar(n)}</span><div class="fl"><div class="nom lien" onclick="openFiche('${n}')">${n}${drap(b.drapeau)}</div><div class="mut sm">${fmtMoy(moyenne(n))} · 💬 ${tousComs(n).length}</div>${badge(statut(n))}</div><div class="fleches"><button ${i===0?"disabled":""} onclick="bouger(${i},-1)" aria-label="Monter">⬆️</button><button ${i===L.length-1?"disabled":""} onclick="bouger(${i},1)" aria-label="Descendre">⬇️</button></div></div>`;});
  return h+`</div>`;
}

/* ===================== 🎓 PAGE PROFS ===================== */
function pageProfs(){
  let h=`<h2 class="titre">🎬 L’équipe</h2><div class="equipe">${EQUIPE.map(([r,n])=>`<div class="eq"><span class="mut sm">${r}</span><b>${esc(n)}</b></div>`).join("")}</div>`;
  h+=`<h2 class="titre">🎓 Les profs</h2><div class="pgrid">${PROFS.map((p,i)=>{const v=S.profs[p.nom]||{note:0,avis:""};return `<div class="pcarte"><div class="cl" style="cursor:default"><span class="av" style="background:${couleur(p.nom)}">${p.e}</span><div><div class="nom">${esc(p.nom)} ${p.nouv?`<span class="new">NOUVEAU</span>`:""}</div><div class="mut sm">${esc(p.role)}</div></div></div>${etoiles(v.note,`setProfNote(${i},#)`)}<textarea id="prof${i}" placeholder="Mon avis sur ${esc(p.nom)}…" oninput="setProfAvis(${i},this.value)">${esc(v.avis)}</textarea></div>`;}).join("")}</div>`;
  return h;
}

/* ===================== 🪪 FICHE ÉLÈVE ===================== */
function parcours(nom){
  const L=[];
  CALv().forEach(c=>{
    const p=primeInfo(c.num),ev=[];
    if(has(p.immunise,nom)) ev.push("🛡️ Immunisé(e)");
    if(has(p.top3,nom)) ev.push("🏅 Top 3 des évaluations");
    if(has(p.nomines,nom)) ev.push("⚠️ Nominé(e)");
    if(has(p.sauve,nom)) ev.push("🙌 Sauvé(e)");
    if(has(p.elimine,nom)) ev.push("❌ Éliminé(e)");
    if(has(p.abandon,nom)) ev.push("🚪 Abandon");
    if(has(p.finalistes,nom)) ev.push("✨ Finaliste");
    if(has(p.gagnant,nom)) ev.push("🏆 Gagnant(e)");
    if(ev.length) L.push(`<li><span class="pbadge sm">Prime ${c.num}</span> ${ev.join(" · ")}</li>`);
  });
  return L.length?`<ul class="parc">${L.join("")}</ul>`:`<p class="mut">Rien de spécial pour l’instant.</p>`;
}
function notesFiche(nom){
  const V=vedette().num,sorti=sortiAu(nom);
  const L=CALv().filter(c=>(c.num<=V&&(!sorti||c.num<=sorti))||noteP(c.num,nom)>0);
  return `<div class="nl">${L.map(c=>{const ch=chansonsDe(nom,c.num);return `<div class="nlr2"><span class="pbadge sm">Prime ${c.num}</span><span class="mut sm">${dCourte(c)}${ch.length?" · 🎵 "+ch.map(x=>esc(x.titre)).join(" / "):""}</span>${etoiles(noteP(c.num,nom),`setPNote(${c.num},'${nom}',#)`)}</div>`;}).join("")}</div>`;
}
function renderFiche(){
  const nom=FICHE; if(!nom) return;
  const b=BIOS[nom]||{},e=S.eleves[nom],st=statut(nom),V=vedette().num,defP=FICHE_P||SEL||V;
  const chs=CALv().flatMap(c=>chansonsDe(nom,c.num).map(x=>Object.assign({num:c.num},x)));
  const opts=["","En compétition","Nominé(e)","Immunisé(e)","Sauvé(e)","Éliminé(e)","Abandon","Finaliste","Gagnant(e)"];
  if(e.statut&&!opts.includes(e.statut)) opts.push(e.statut);
  let h=`<div class="fhead">${avatar(nom,"big")}<div class="fl">
      <h2>${nom}${drap(b.drapeau)}</h2>
      <div class="mut">${esc(b.nom||"")}</div>
      <div>🎂 ${b.age||"?"} ans · 📍 ${esc(b.ville||"")}${b.region?" ("+esc(b.region)+")":""}</div>
      <div class="row2">${badge(st)}<button class="chip${e.fav?" on":""}" onclick="toggleFav('${nom}')">${e.fav?"⭐ Dans mes préférés":"☆ Ajouter à mes préférés"}</button></div>
    </div></div>`;
  if(b.faits&&b.faits.length) h+=`<ul class="faits">${b.faits.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`;
  h+=`<section class="fsec" id="secComs"><h3>${avatar(nom,"moy")}<span>💬 Mes commentaires sur ${nom}</span></h3>
    <div class="addcom">
      <label class="sm">Ce commentaire concerne :
        <select id="fcPrime" data-keep>${CALv().map(c=>`<option value="${c.num}" ${c.num===defP?"selected":""}>Prime ${c.num} · ${dCourte(c)}${c.num===V?" (en ce moment)":""}</option>`).join("")}</select></label>
      <textarea id="fcTxt" data-keep placeholder="Écris ce que tu as pensé de ${nom} (prestation, quotidienne, progrès…)"></textarea>
      <button class="btn" onclick="ajouterCom('${nom}')">➕ Ajouter le commentaire</button>
    </div>${timeline(nom)}</section>`;
  h+=`<section class="fsec"><h3>⭐ Mes notes prime par prime</h3>${notesFiche(nom)}</section>`;
  h+=`<section class="fsec"><h3>🎵 Ses chansons</h3>${chs.length?`<ul class="chl">${chs.map(x=>`<li><span class="pbadge sm">Prime ${x.num}</span> <b>${esc(x.titre)}</b> <span class="mut">– ${esc(x.artiste)}${x.avec.length?" · avec "+esc(x.avec.join(", ")):""}</span></li>`).join("")}</ul>`:`<p class="mut">Pas encore de chanson connue.</p>`}</section>`;
  h+=`<section class="fsec"><h3>📋 Parcours officiel</h3>${parcours(nom)}</section>`;
  h+=`<section class="fsec"><h3>🌟 Ma note générale</h3>${etoiles(e.note,`setNote('${nom}',#)`)}</section>`;
  h+=`<section class="fsec"><h3>🛠️ Réglages</h3>
    <label class="sm">Corriger le statut :
      <select onchange="setStatut('${nom}',this.value)">${opts.map(o=>`<option value="${esc(o)}" ${e.statut===o?"selected":""}>${o?esc(o):"🔄 Automatique ("+esc(statutAuto(nom))+")"}</option>`).join("")}</select></label>
    <div class="row2" style="margin-top:10px">
      <button class="btn" onclick="lienPhoto('${nom}')">🔗 Coller le lien d’une photo</button>
      <label class="btn sec">📷 Choisir une photo<input type="file" accept="image/*" hidden onchange="choisirPhoto('${nom}',this)"></label>
      ${S.photos[nom]?`<button class="btn sec" onclick="supprPhoto('${nom}')">🗑️ Retirer ma photo</button>`:""}
    </div>
    ${PHOTO_KO["u:"+nom]?`<p class="sm" style="color:#ffb0b0">⚠️ Le lien de la photo ne marche pas (le site d’origine la bloque peut-être). Essaie un autre lien.</p>`:""}
  </section>`;
  $("#mbody").innerHTML=h;
}
function openFiche(nom,versComs,prime){
  if(!S.eleves[nom]) return;
  FICHE=nom;FICHE_P=prime||null;
  $("#modal").hidden=false;document.body.classList.add("noscroll");
  renderFiche();
  const box=$("#mbox");box.scrollTop=0;
  if(versComs){const s=$("#secComs");if(s)box.scrollTop=s.offsetTop-10;}
}
function fermerFiche(){
  const ta=$("#fcTxt");
  if(ta&&ta.value.trim()&&!confirm("✍️ Ton commentaire n’est pas encore ajouté. Fermer quand même ?")) return;
  FICHE=null;FICHE_P=null;
  $("#modal").hidden=true;document.body.classList.remove("noscroll");$("#mbody").innerHTML="";
  refresh();
}

/* ===================== 🎛️ ACTIONS ===================== */
function toggleFav(nom){const e=S.eleves[nom];e.fav=!e.fav;syncOrdre();save();refresh();toast(e.fav?"⭐ "+nom+" ajouté(e) à tes préférés":"☆ "+nom+" retiré(e) de tes préférés");}
function setPNote(num,nom,n){const pd=primeData(num);const pe=pd.eleves[nom]=pd.eleves[nom]||{note:0,coms:[]};pe.note=(pe.note===n?0:n);save();refresh();}
function setNote(nom,n){const e=S.eleves[nom];e.note=(e.note===n?0:n);save();refresh();}
function setStatut(nom,v){S.eleves[nom].statut=v;save();refresh();toast(v?"🛠️ Statut corrigé":"🔄 Statut automatique");}
function setAvis(num,v){primeData(num).avis=v;save();}
function setBest(num,v){primeData(num).best=v;save();refresh();}
function setProfNote(i,n){const k=PROFS[i].nom;const v=S.profs[k]=S.profs[k]||{note:0,avis:""};v.note=(v.note===n?0:n);save();refresh();}
function setProfAvis(i,val){const k=PROFS[i].nom;const v=S.profs[k]=S.profs[k]||{note:0,avis:""};v.avis=val;save();}
function bouger(i,d){const j=i+d;if(j<0||j>=S.ordre.length)return;const t=S.ordre[i];S.ordre[i]=S.ordre[j];S.ordre[j]=t;save();refresh();}
function trierMoy(){S.ordre.sort((a,b)=>{const A=moyenne(a),B=moyenne(b);return (B.moy-A.moy)||(S.eleves[b].note-S.eleves[a].note);});save();refresh();toast("📊 Classement trié par moyenne");}
/* 🔗 Photo par lien (sur cet appareil) */
function lienPhoto(nom){
  const v=prompt("🔗 Colle ici l’adresse de la photo de "+nom+" (elle commence par https://)","");
  if(v===null) return;
  const u=v.trim();
  if(!/^https?:\/\/\S+$/i.test(u)){alert("😕 Ce n’est pas un lien valide. Il doit commencer par https://");return;}
  S.photos[nom]=u;delete PHOTO_KO["u:"+nom];save();refresh();toast("📸 Photo ajoutée pour "+nom);
}
function choisirPhoto(nom,inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const M=320,k=Math.min(1,M/Math.max(img.width,img.height));const w=Math.round(img.width*k),h=Math.round(img.height*k);const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);S.photos[nom]=cv.toDataURL("image/jpeg",.82);delete PHOTO_KO["u:"+nom];save();refresh();toast("📷 Photo enregistrée");};img.onerror=()=>alert("Image illisible 😕");img.src=r.result;};
  r.readAsDataURL(f);inp.value="";
}
function supprPhoto(nom){if(!confirm("Retirer ta photo de "+nom+" ?"))return;delete S.photos[nom];delete PHOTO_KO["u:"+nom];save();refresh();}
function allerOnglet(o){ONGLET=o;try{history.replaceState(null,"","#"+o);}catch(e){}refresh();window.scrollTo(0,0);}
let TT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(TT);TT=setTimeout(()=>t.classList.remove("on"),2200);}

/* ===================== 🔁 AFFICHAGE (garde le texte en cours) ===================== */
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.o===ONGLET));
  $("#main").innerHTML=ONGLET==="primes"?pagePrimes():ONGLET==="classement"?pageClassement():ONGLET==="profs"?pageProfs():pageEleves();
  majInfo();
}
function refresh(){
  const keep={};
  document.querySelectorAll("[data-keep]").forEach(el=>{if(el.id)keep[el.id]=el.value;});
  const a=document.activeElement,aid=a&&a.id?a.id:null;
  let s1=null,s2=null;
  try{if(a&&typeof a.selectionStart==="number"){s1=a.selectionStart;s2=a.selectionEnd;}}catch(e){}
  const box=$("#mbox"),st=box?box.scrollTop:0;
  render();
  if(FICHE) renderFiche();
  Object.keys(keep).forEach(id=>{const el=document.getElementById(id);if(el)el.value=keep[id];});
  if(box) box.scrollTop=st;
  if(aid){const el=document.getElementById(aid);if(el&&el!==document.activeElement){try{el.focus({preventScroll:true});if(s1!==null&&el.setSelectionRange)el.setSelectionRange(s1,s2);}catch(e){}}}
}

/* ===================== 🌐 MISE À JOUR AUTOMATIQUE ===================== */
function majInfo(){
  const el=$("#majInfo"); if(!el) return;
  const o=S.officiel||{}; let t="";
  if(o.maj){const d=parseD(o.maj);t=d?d.toLocaleString("fr-FR",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):String(o.maj);}
  let src="";
  if(typeof o.source==="string"&&o.source) src=/^https?:\/\//.test(o.source)?` · <a href="${esc(o.source)}" target="_blank" rel="noopener">source</a>`:" · "+esc(o.source);
  el.innerHTML=(ETAT_MAJ==="hors"?"📴 Infos officielles injoignables pour l’instant (je garde les dernières). ":"")+(t?"🔄 Infos officielles mises à jour : "+esc(t):"🔄 Infos officielles : en attente de la 1re mise à jour automatique")+src;
}
async function majAuto(){
  const sansMaj=o=>JSON.stringify(Object.assign({},o||{},{maj:0}));
  for(const url of [RAW_URL,"data.json"]){
    try{
      const r=await fetch(url+"?t="+Date.now(),{cache:"no-store"});
      if(!r.ok) continue;
      const d=await r.json();
      if(!d||typeof d!=="object"||Array.isArray(d)) continue;
      ETAT_MAJ="ok";
      const premier=!S.officiel||!Object.keys(S.officiel).length;
      const change=sansMaj(S.officiel)!==sansMaj(d);
      S.officiel=d;save();
      if(change){if(!SEL_MANUEL)SEL=vedette().num;refresh();if(!premier)toast("🔄 Nouvelles infos officielles !");}
      else majInfo();
      return;
    }catch(e){}
  }
  ETAT_MAJ="hors";majInfo();
}

/* ===================== 🚀 DÉMARRAGE ===================== */
try{S=JSON.parse(localStorage.getItem(CLE)||"null");}catch(e){S=null;}
migrer();save();
SEL=vedette().num;
render();
majAuto();
setInterval(majAuto,5*60*1000);
setInterval(()=>{
  if(!SEL_MANUEL) SEL=vedette().num;
  const a=document.activeElement;
  const occupe=a&&/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName);
  if(!occupe&&!FICHE&&ONGLET==="eleves") refresh();
},60*1000);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&FICHE)fermerFiche();});
</script>
