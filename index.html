<meta name="viewport" content="width=device-width, initial-scale=1">

<title>⭐ Star Academy 2026 · Mon carnet de fan</title>
<style>
:root{--card:#22163f;--card2:#2c1d52;--bord:#3d2b72;--txt:#f5f0ff;--mut:#b8a9dc;--or:#ffcf4d;--rose:#ff5fa2}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#120a26 radial-gradient(circle at top,#2d1756,#120a26 60%) fixed;color:var(--txt);line-height:1.4}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
a{color:var(--or)}
header{text-align:center;padding:20px 14px 8px}
h1{margin:0;font-size:1.8rem;background:linear-gradient(90deg,var(--or),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.sous{color:var(--mut);font-size:.9rem;margin-top:4px}
.cbar{margin-top:10px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
nav{position:sticky;top:0;z-index:30;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px 8px;background:rgba(18,10,38,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--bord)}
nav button{background:var(--card);color:var(--txt);border:1px solid var(--bord);border-radius:999px;padding:8px 14px;font-size:.95rem;cursor:pointer;font-family:inherit}
nav button.on{background:linear-gradient(90deg,var(--or),var(--rose));color:#1a0b2e;font-weight:700;border-color:transparent}
main{max-width:1100px;margin:0 auto;padding:14px}
.mut{color:var(--mut)}.sm{font-size:.82rem}.or{color:var(--or)}
.titre{margin:8px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(90deg,var(--or),var(--rose));color:#1a0b2e;border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:.92rem;font-family:inherit}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--bord);font-weight:600}
.btn.petit{padding:5px 10px;font-size:.8rem}

select,textarea{font:inherit;color:var(--txt);background:#1a1033;border:1px solid var(--bord);border-radius:10px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
.vedette{background:linear-gradient(135deg,#3b1f74,#5a1e5c);border:1px solid #7a4bc4;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 30px rgba(0,0,0,.35);display:grid;gap:4px}
.vedette h2{margin:6px 0 2px;font-size:1.35rem}
.vedette .btn{margin-top:10px;justify-self:start}
.vtop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}
.vtag{background:var(--or);color:#1a0b2e;border-radius:999px;padding:2px 10px;font-size:.75rem}
details.bloc{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:10px 14px;margin-bottom:12px}
summary{cursor:pointer;font-weight:600}
.actus ul{margin:8px 0 0;padding-left:20px}.actus li{margin-bottom:4px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:12px 0}
.chip{background:var(--card);color:var(--txt);border:1px solid var(--bord);border-radius:999px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:.88rem}
.chip.on{border-color:var(--or);color:var(--or);background:var(--card2)}
.filtres{display:flex;gap:6px;flex-wrap:wrap}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.carte{position:relative;background:var(--card);border:1px solid var(--bord);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.carte.fav{border-color:var(--or);box-shadow:0 0 0 1px rgba(255,207,77,.25)}
.dehors{opacity:.55;filter:grayscale(.6)}
.cl{display:flex;gap:10px;align-items:center;cursor:pointer;padding-right:30px}
.nom{font-weight:700;font-size:1.05rem}
.star{position:absolute;top:8px;right:8px;background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--or)}
.av{position:relative;flex:0 0 auto;width:54px;height:54px;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;color:#fff;border:2px solid rgba(255,255,255,.25);vertical-align:middle}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.av.big{width:96px;height:96px;font-size:2.4rem}
.av.moy{width:44px;height:44px;font-size:1.1rem}
.av.mini{width:28px;height:28px;font-size:.8rem;border-width:1px}
.zoomable{display:inline-flex;cursor:zoom-in;border-radius:50%;transition:transform .15s}
.zoomable:hover{transform:scale(1.05)}
.drap{height:.85em;width:auto;border-radius:2px;vertical-align:-1px;margin-left:4px;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.76rem;font-weight:700;width:max-content;max-width:100%}
.b-ok{background:#1f4d3c;color:#7ff0c0}.b-nom{background:#5a2626;color:#ffb0b0}.b-imm{background:#1d3f5c;color:#9fdcff}.b-elim{background:#3a3a3a;color:#ccc}.b-win{background:var(--or);color:#1a0b2e}.b-fin{background:#5b3d0f;color:#ffd98a}.b-sauve{background:#244a1f;color:#b5f59f}
.chs{font-size:.86rem}
.pnote{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;background:var(--card2);border-radius:10px;padding:4px 8px}
.etoiles{display:inline-flex;white-space:nowrap}
.etoiles button{background:none;border:0;font-size:1.35rem;cursor:pointer;color:#5b4a8a;padding:0 1px;line-height:1}
.etoiles button.on{color:var(--or)}
.carte .coms{margin-top:auto}
.modal{position:fixed;inset:0;background:rgba(5,2,15,.78);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16px}
#compte{z-index:60}
.mbox{position:relative;background:#1c1238;border:1px solid var(--bord);border-radius:18px;max-width:720px;width:100%;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;padding:18px;overscroll-behavior:contain}
.cbox{max-width:440px;margin-top:30px}
.x{position:sticky;top:0;float:right;z-index:3;width:38px;height:38px;border-radius:50%;background:var(--card2);color:var(--txt);border:1px solid var(--bord);font-size:1.05rem;cursor:pointer}
.cform{display:grid;gap:10px;margin-top:12px}
.cform label{display:grid;gap:4px}
.cform input{font:inherit;color:var(--txt);background:#1a1033;border:1px solid var(--bord);border-radius:10px;padding:10px 12px;width:100%}
.cmsg{min-height:1.2em;font-weight:600;margin-top:10px;color:#9fdcff}
.cmsg.err{color:#ffb0b0}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(5,2,15,.94);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;cursor:zoom-out;animation:zin .2s ease}
.zoom img{max-width:92vw;max-height:75vh;max-height:75dvh;border-radius:18px;border:3px solid var(--or);box-shadow:0 10px 40px rgba(0,0,0,.6);object-fit:contain;background:#000}
.znom{font-size:1.5rem;font-weight:800;text-align:center}
.zoom .x{position:absolute;top:14px;right:14px;float:none;width:46px;height:46px;font-size:1.3rem}
@keyframes zin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.fhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fhead h2{margin:0}
.fl{flex:1;min-width:0}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.faits{margin:12px 0 0;padding-left:20px;color:var(--mut)}
.fsec{border-top:1px solid var(--bord);margin-top:14px;padding-top:12px}
.fsec h3{margin:0 0 10px;font-size:1.05rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.addcom{display:grid;gap:8px;background:var(--card);border:1px dashed var(--or);border-radius:12px;padding:10px;margin-bottom:14px}
.addcom label{display:grid;gap:4px}
.tlbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tl{border-left:3px solid var(--bord);margin-left:6px;padding-left:12px}
.tlg{margin-bottom:14px}
.tlh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px -20px}
.tlh::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--or);box-shadow:0 0 0 3px #1c1238;flex:0 0 auto}
.com{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:10px;margin-bottom:8px}
.cmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;margin-bottom:4px}
.ctxt{word-wrap:break-word;overflow-wrap:anywhere}
.cact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cact button{background:var(--card2);border:1px solid var(--bord);color:var(--txt);border-radius:8px;padding:4px 8px;font-size:.78rem;cursor:pointer;font-family:inherit}
.pbadge{background:linear-gradient(90deg,var(--or),var(--rose));color:#1a0b2e;font-weight:800;border-radius:999px;padding:2px 10px;font-size:.8rem;white-space:nowrap}
.pbadge.sm{font-size:.7rem;padding:1px 8px}
.chl{padding-left:20px;margin:6px 0}.chl li{margin-bottom:5px}
.parc{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.nl{display:grid;gap:6px;margin-top:8px}
.nlr{display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,1.6fr) auto auto;gap:8px;align-items:center;background:var(--card);border-radius:10px;padding:6px 8px}
.nlr2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border-radius:10px;padding:6px 8px}
.nlr2 .etoiles{margin-left:auto}
.nm{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.lien{cursor:pointer}.lien:hover{text-decoration:underline}
.tag{font-size:.72rem;border-radius:999px;padding:2px 8px;background:var(--card2);margin-left:4px;white-space:nowrap;font-weight:600}
.tag.or{background:var(--or);color:#1a0b2e}.tag.ok{background:#1f4d3c;color:#7ff0c0}
.pbody{display:grid;gap:12px;margin-top:10px}
.offi,.mien{background:var(--card2);border-radius:12px;padding:10px}
.offi>div{margin-bottom:3px}
h4{margin:0 0 8px}
.mien textarea{margin:8px 0}
.wiki{margin-top:10px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:14px 0}
.pod{text-align:center;cursor:pointer;width:110px}
.pod .av{width:72px;height:72px;font-size:1.8rem}
.pod .nom{font-size:.95rem;margin-top:4px}
.marche{margin-top:6px;border-radius:10px 10px 0 0;color:#1a0b2e;font-weight:900;font-size:1.4rem;display:flex;align-items:center;justify-content:center}
.p1 .marche{height:90px;background:linear-gradient(180deg,var(--or),#b8860b)}
.p2 .marche{height:65px;background:linear-gradient(180deg,#eeeef6,#9a9ab0)}
.p3 .marche{height:45px;background:linear-gradient(180deg,#e7ab72,#9c5b28)}
.liste .row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.rang{font-weight:900;color:var(--or);width:26px;text-align:center;font-size:1.1rem}
.fleches{display:flex;flex-direction:column;gap:4px}
.fleches button{background:var(--card2);border:1px solid var(--bord);border-radius:8px;cursor:pointer;padding:2px 6px}
.fleches button:disabled{opacity:.3;cursor:default}
.equipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.eq{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:10px;display:grid;gap:2px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcarte{background:var(--card);border:1px solid var(--bord);border-radius:16px;padding:14px;display:grid;gap:8px}
.new{background:var(--rose);color:#fff;border-radius:999px;padding:1px 8px;font-size:.66rem;font-weight:800;vertical-align:middle}
.vide{text-align:center;padding:30px 16px;background:var(--card);border-radius:16px;border:1px dashed var(--bord)}
/* 📅 QUOTIDIENNE */
.qinfo{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.qinfo .tag{margin-left:0;font-size:.78rem;padding:4px 10px}
.retenir{background:linear-gradient(135deg,#3b1f74,#5a1e5c);border:1px solid #7a4bc4;border-radius:18px;padding:14px 16px;margin-bottom:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.retenir h3{margin:0 0 8px;font-size:1.15rem}
.retenir ul{margin:0;padding-left:20px}.retenir li{margin-bottom:6px}
.semaine{margin:20px 0 10px;font-size:1.1rem;color:var(--or)}
.qcard{background:var(--card);border:1px solid var(--bord);border-radius:16px;padding:14px;margin-bottom:12px}
.qcard.avenir{border-style:dashed;border-color:var(--or)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qdate{font-weight:800;color:var(--or)}
.qcard h3{margin:6px 0 4px;font-size:1.1rem}
.qcard ul{margin:8px 0 0;padding-left:20px}.qcard li{margin-bottom:6px}
.qav{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.qn{font-weight:700;color:#ffd9ec}
.evals{display:grid;gap:8px;margin-top:10px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--card2);border:1px solid var(--bord);border-left:5px solid #6b6b8a;border-radius:12px;padding:10px}
.ev.top{border-left-color:#3ddc97}.ev.mitige{border-left-color:var(--or)}.ev.bof{border-left-color:#ff6b6b}
.evh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:1rem}
.doute{font-size:.78rem;color:#ffd98a;margin-top:4px}
.legende{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--mut);margin-top:8px}
.groupes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.grp{background:var(--card2);border:1px solid var(--bord);border-radius:12px;padding:10px}
.grp b{display:block;margin-bottom:6px}
.grp .nm{margin:3px 8px 3px 0}
.auto{font-size:.68rem;background:#1d3f5c;color:#9fdcff;border-radius:999px;padding:1px 8px;font-weight:700;vertical-align:middle}
footer{max-width:1100px;margin:10px auto 30px;padding:14px;text-align:center;color:var(--mut);font-size:.84rem;display:grid;gap:6px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140px);background:var(--or);color:#1a0b2e;font-weight:700;padding:10px 18px;border-radius:999px;transition:transform .3s;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
@media (max-width:640px){
  h1{font-size:1.45rem}
  .nlr{grid-template-columns:1fr auto auto}
  .nlr .chx{grid-column:1/-1;grid-row:2}
  .mbox{padding:14px}
  .modal{padding:8px}
  nav button{padding:7px 11px;font-size:.88rem}
}
</style>

const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

function norm(s){return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();}
function sameName(a,b){a=norm(a);b=norm(b);return !!a&&!!b&&(a===b||a.startsWith(b+" ")||a.startsWith(b+"."));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function slug(n){return norm(n).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");}
function obj(x){return x&&typeof x==="object"&&!Array.isArray(x)?x:{};}
function liste2(x){
  if(x==null||x==="") return [];
  if(Array.isArray(x)) return x.flatMap(liste2);
  if(typeof x==="object") return x.nom?[String(x.nom)]:(x.texte?[String(x.texte)]:[]);
  const s=String(x).trim(); return s?[s]:[];
}
function liste(x){return liste2(x).flatMap(s=>s.split(/\s*(?:,|;|&|\/|\bet\b)\s*/i)).map(s=>s.trim()).filter(Boolean);}
function has(x,nom){return liste(x).some(n=>sameName(n,nom));}
function pad(n){return String(n).padStart(2,"0");}
function isoJour(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}

  if(typeof d==="number") return new Date(d);
  const s=String(d);
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\D+(\d{1,2})[h:](\d{2}))?/);
  if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1],+(m[4]||12),+(m[5]||0));}
  const t=new Date(s); return isNaN(t)?null:t;
}
function tms(d){const t=parseD(d);return t?t.getTime():0;}
function fDate(d){const t=parseD(d);if(!t)return "";return "le "+pad(t.getDate())+"/"+pad(t.getMonth()+1)+(t.getFullYear()!==2026?"/"+t.getFullYear():"")+" à "+pad(t.getHours())+"h"+pad(t.getMinutes());}
function jourP(c){return String(c.date).split("-").map(Number);}
function dateP(c){const [y,m,d]=jourP(c);return new Date(y,m-1,d,21,10);}
function lundiApres(c){const [y,m,d]=jourP(c);const j=new Date(y,m-1,d).getDay();return new Date(y,m-1,d+(((8-j)%7)||7));}
function debutJour(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function numJ(n){return n===1?"1er":String(n);}
function dCourte(c){const d=dateP(c);return numJ(d.getDate())+" "+MOISC[d.getMonth()]+(d.getFullYear()!==2026?" "+d.getFullYear():"");}
function dLongue(c){const d=dateP(c);return JOURS[d.getDay()]+" "+numJ(d.getDate())+" "+MOIS[d.getMonth()]+(d.getFullYear()!==2026?" "+d.getFullYear():"");}
function couleur(n){let h=0;for(const ch of String(n))h=(h*31+ch.codePointAt(0))%360;return "linear-gradient(135deg,hsl("+h+",70%,55%),hsl("+((h+50)%360)+",65%,38%))";}
/* 🏳️ Drapeaux en image (Windows affiche sinon "FR") */
function drap(f){
  const cp=Array.from(String(f||"")).map(c=>c.codePointAt(0)).filter(x=>x>=0x1F1E6&&x<=0x1F1FF);
  let h="";
  for(let i=0;i+1<cp.length;i+=2){const cc=String.fromCharCode(cp[i]-0x1F1E6+97,cp[i+1]-0x1F1E6+97);h+=`<img class="drap" src="https://flagcdn.com/w40/${cc}.png" alt="${cc.toUpperCase()}" title="${cc.toUpperCase()}">`;}
  return h;
}
/* 🔁 Deux phrases qui disent la même chose ? (pour éviter les doublons) */
function motsCles(t){return new Set(norm(t).replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(w=>w.length>=4));}
function pareil(a,b){
  const A=motsCles(a),B=motsCles(b);
  if(!A.size||!B.size) return false;
  let c=0;A.forEach(w=>{if(B.has(w))c++;});
  return c/Math.min(A.size,B.size)>=0.5;
}
function sansDoublons(L){const out=[];L.forEach(t=>{if(t&&!out.some(u=>pareil(u,t)))out.push(t);});return out;}

/* ===================== 📅 CALENDRIER & PRIMES ===================== */
function CALv(){
  const auto=(S&&S.officiel&&Array.isArray(S.officiel.calendrier))?S.officiel.calendrier:[];
  return CAL_BASE.map(c=>{
    const a=auto.find(x=>x&&+x.num===c.num);
    if(!a) return c;
    const r=Object.assign({},c);
    if(typeof a.date==="string"&&/^\d{4}-\d{2}-\d{2}/.test(a.date)) r.date=a.date.slice(0,10);
    if(a.ok===true) r.ok=true;
    const inv=liste2(a.invites); if(inv.length) r.invites=inv;
    if(typeof a.titre==="string"&&a.titre.trim()) r.titre=a.titre.trim();
    return r;
  });
}
function vedette(){const now=new Date(),cal=CALv();return cal.find(c=>now<lundiApres(c))||cal[cal.length-1];}
function primeDeDate(d){const t=parseD(d),cal=CALv();if(!t)return 1;const c=cal.find(x=>t<lundiApres(x));return (c||cal[cal.length-1]).num;}
function primeInfo(num){
  num=+num;
  const b=PRIMES_BASE[num]||{};
  const auto=(S&&S.officiel&&Array.isArray(S.officiel.primes))?S.officiel.primes:[];
  const a=auto.find(x=>x&&+x.num===num)||{};
  const r={num};
  ["nomines","sauve","elimine","abandon","immunise","top3","finalistes","gagnant","invites","wiki"].forEach(k=>{const A=liste2(a[k]);r[k]=A.length?A:liste2(b[k]);});
  const ca=Array.isArray(a.chansons)?a.chansons.filter(x=>x&&typeof x==="object"):[];
  r.chansons=ca.length?ca:(b.chansons||[]);
  return r;
}
function invitesDe(num){const p=primeInfo(num);const c=CALv().find(x=>x.num===+num)||{};return p.invites.length?p.invites:liste2(c.invites);}
function chansonsDe(nom,num){

  return out;
}

function statutTexteOfficiel(nom){
  const st=S.officiel&&S.officiel.statuts;
  if(Array.isArray(st)){const f=st.find(x=>x&&sameName(x.nom||x.prenom||"",nom));return f?String(f.statut||f.status||""):"";}
  if(st&&typeof st==="object"){const k=Object.keys(st).find(k=>sameName(k,nom));return k?String(st[k]||""):"";}
  return "";

    const p=primeInfo(c.num);
    if(has(p.gagnant,nom)) return "Gagnant(e) 🏆";
    if(has(p.elimine,nom)) return "Éliminé(e) au prime "+c.num;
    if(has(p.abandon,nom)) return "Abandon (prime "+c.num+")";
  }
  const V=vedette().num,pv=primeInfo(V),pp=V>1?primeInfo(V-1):primeInfo(V);
  if(has(pv.finalistes,nom)) return "Finaliste ✨";
  if(has(pv.sauve,nom)) return "Sauvé(e) 🙌";
  if(has(pv.nomines,nom)) return "Nominé(e) ⚠️";
  if(has(pv.immunise,nom)||(V>1&&has(pp.immunise,nom))) return "Immunisé(e) 🛡️";
  return txt||"En compétition";
}
function statut(nom){const e=S.eleves[nom];return (e&&e.statut)||statutAuto(nom);}
function classeStatut(s){
  s=norm(s);
  if(/elimin|abandon|quitte|parti/.test(s)) return "elim";
  if(/gagn|vainq/.test(s)) return "win";
  if(/finalist/.test(s)) return "fin";
  if(/nomin|nomme/.test(s)) return "nom";
  if(/immun/.test(s)) return "imm";
  if(/sauve/.test(s)) return "sauve";
  return "ok";
}
function badge(st){return `<span class="badge b-${classeStatut(st)}">${esc(st)}</span>`;}

/* ecrire() = enregistre sur l'appareil ; save() = c'est TOI qui as changé quelque chose → aussi envoyé au compte */
function ecrire(){try{localStorage.setItem(CLE,JSON.stringify(S));return true;}catch(e){alert("⚠️ La mémoire du navigateur est pleine ! Retire quelques photos pour pouvoir enregistrer.");return false;}}
function save(){S.modif=Date.now();ecrire();if(UTIL&&PRET)planifierEnvoi();}
function normCom(c){
  if(c==null) return null;
  if(typeof c!=="object") c={t:String(c)};
  const t=c.t??c.texte??c.text??c.txt??c.msg??"";
  const pd=parseD(c.d??c.date??c.ts??null);
  const o={t:String(t),d:pd?pd.toISOString():null};
  if(c.m) o.m=c.m;
  if(+c.prime>=1) o.prime=+c.prime;
  return o;
}
function migrer(){
  if(!S||typeof S!=="object"||Array.isArray(S)) S={};
  S.officiel=obj(S.officiel);
  S.photos=obj(S.photos);
  S.profs=obj(S.profs);
  S.primes=obj(S.primes);
  S.eleves=obj(S.eleves);
  if(!Array.isArray(S.ordre)) S.ordre=[];
  Object.keys(S.primes).forEach(k=>{
    const num=parseInt(String(k).replace(/\D+/g,""),10);
    if(!(num>=1)) return;
    const p=obj(S.primes[k]);
    p.avis=typeof p.avis==="string"?p.avis:"";
    p.best=typeof p.best==="string"?p.best:"";
    p.eleves=obj(p.eleves);
    Object.keys(p.eleves).forEach(n=>{
      let pe=p.eleves[n]; if(typeof pe==="number") pe={note:pe}; pe=obj(pe);
      pe.note=+pe.note||0;
      pe.coms=(Array.isArray(pe.coms)?pe.coms:[]).map(normCom).filter(c=>c&&c.t.trim());
      pe.coms.forEach(c=>{c.prime=num;});
      p.eleves[n]=pe;
    });
    if(String(num)!==String(k)&&!S.primes[num]){delete S.primes[k];S.primes[num]=p;}else S.primes[k]=p;
  });
  ELEVES.forEach(n=>{
    const e=obj(S.eleves[n]);
    e.fav=!!e.fav; e.note=+e.note||0; e.statut=typeof e.statut==="string"?e.statut:"";
    const coms=Array.isArray(e.coms)?e.coms:[];
    ["com","commentaire","comment","avis"].forEach(f=>{if(typeof e[f]==="string"){if(e[f].trim())coms.push({t:e[f],d:null});delete e[f];}});
    e.coms=coms.map(normCom).filter(c=>c&&c.t.trim());
    e.coms.forEach(c=>{if(!(c.prime>=1)) c.prime=c.d?primeDeDate(c.d):1;});
    S.eleves[n]=e;
  });
  Object.keys(S.profs).forEach(k=>{
    let v=S.profs[k];
    if(typeof v==="number") v={note:v,avis:""}; else if(typeof v==="string") v={note:0,avis:v};
    v=obj(v); v.note=+v.note||0; if(typeof v.avis!=="string") v.avis="";
    if(!v.avis&&Array.isArray(v.coms)&&v.coms.length) v.avis=v.coms.map(normCom).filter(Boolean).map(c=>c.t).join("\n");
    let cible=k;
    if(!PROFS.some(p=>p.nom===k)){const w=norm(k).split(/\s+/)[0];const pr=w.length>=3?PROFS.find(p=>norm(p.nom).split(/\s+/).includes(w)):null;if(pr&&!S.profs[pr.nom])cible=pr.nom;}
    if(cible!==k) delete S.profs[k];
    S.profs[cible]=v;
  });
  syncOrdre();
  S.v=5;
}
function primeData(num){const k=String(num);if(!S.primes[k])S.primes[k]={avis:"",best:"",eleves:{}};return S.primes[k];}
function noteP(num,nom){const p=S.primes[String(num)];return (p&&p.eleves&&p.eleves[nom]&&+p.eleves[nom].note)||0;}
function syncOrdre(){
  S.ordre=S.ordre.filter((n,i,a)=>ELEVES.includes(n)&&S.eleves[n]&&S.eleves[n].fav&&a.indexOf(n)===i);
  ELEVES.forEach(n=>{if(S.eleves[n]&&S.eleves[n].fav&&!S.ordre.includes(n))S.ordre.push(n);});
}
function moyenne(nom){const ns=Object.keys(S.primes).filter(k=>/^\d+$/.test(k)).map(k=>noteP(k,nom)).filter(x=>x>0);return {moy:ns.length?ns.reduce((a,b)=>a+b,0)/ns.length:0,nb:ns.length};}
function fmtMoy(m){return m.nb?`⭐ ${m.moy.toFixed(1).replace(".",",")}/5 sur ${m.nb} prime${m.nb>1?"s":""}`:"Pas encore noté";}

/* ➕ Ajoute les données de l'appareil (b) à celles du compte (a) */
function unionComs(a,b){
  const L=(Array.isArray(a)?a:[]).slice();
  (Array.isArray(b)?b:[]).forEach(c=>{
    if(!c) return;
    const t=typeof c==="object"?c.t:String(c),d=(c&&c.d)||null;
    if(!L.some(x=>x&&(typeof x==="object"?x.t:String(x))===t&&((x&&x.d)||null)===d)) L.push(c);
  });
  return L;
}
function joindre(a,b){
  a=typeof a==="string"?a:"";b=typeof b==="string"?b:"";
  if(!b.trim()||a.includes(b.trim())) return a;
  if(!a.trim()) return b;
  return a+"\n"+b;
}
function fusionDonnees(compte,appareil){
  const A=obj(JSON.parse(JSON.stringify(compte||{}))),B=obj(appareil);
  A.eleves=obj(A.eleves);
  Object.keys(obj(B.eleves)).forEach(n=>{
    const x=obj(A.eleves[n]),y=obj(B.eleves[n]);
    x.fav=!!(x.fav||y.fav);
    x.note=+x.note||+y.note||0;
    x.statut=x.statut||y.statut||"";
    x.coms=unionComs(x.coms,y.coms);
    A.eleves[n]=x;
  });
  A.primes=obj(A.primes);
  Object.keys(obj(B.primes)).forEach(k=>{
    const x=obj(A.primes[k]),y=obj(B.primes[k]);
    x.avis=joindre(x.avis,y.avis);
    x.best=x.best||y.best||"";
    x.eleves=obj(x.eleves);
    Object.keys(obj(y.eleves)).forEach(n=>{
      const p=obj(x.eleves[n]),q=obj(y.eleves[n]);
      p.note=+p.note||+q.note||0;
      p.coms=unionComs(p.coms,q.coms);
      x.eleves[n]=p;
    });
    A.primes[k]=x;
  });
  A.profs=obj(A.profs);
  Object.keys(obj(B.profs)).forEach(k=>{
    const x=obj(A.profs[k]),y=obj(B.profs[k]);
    x.note=+x.note||+y.note||0;
    x.avis=joindre(x.avis,y.avis);
    A.profs[k]=x;
  });
  A.photos=Object.assign({},obj(B.photos),obj(A.photos));
  A.ordre=(Array.isArray(A.ordre)?A.ordre:[]).concat(Array.isArray(B.ordre)?B.ordre:[]);
  A.modif=Date.now();
  return A;
}
async function changementCompte(user){
  if(DESABO){DESABO();DESABO=null;}
  clearTimeout(ENVOI_T);ENVOI_T=null;PRET=false;
  let uidLocal=null;try{uidLocal=localStorage.getItem(CLE+"_uid");}catch(e){}
  if(!user){
    UTIL=null;SYNC="off";
    if(uidLocal) viderAppareil();
    majCompteBar();renderCompte();
    return;
  }
  UTIL=user;SYNC="sync";majCompteBar();renderCompte();
  let cloud=null,lu=false;
  try{
    const doc=await DB.collection("comptes").doc(user.uid).get();
    lu=true;
    if(doc.exists){try{cloud=JSON.parse(doc.data().json||"null");}catch(e){cloud=null;}}
  }catch(e){console.warn(e);}
  if(UTIL!==user) return;
  if(!lu){
    if(uidLocal===user.uid){
      SYNC="err";majCompteBar();renderCompte();
      setTimeout(()=>{if(UTIL===user&&!PRET)changementCompte(user);},60*1000);
      return;
    }
    CMSG="📴 Impossible de joindre ton compte. Vérifie ta connexion internet et réessaie.";CMSG_ERR=true;
    try{await AUTH.signOut();}catch(e){}
    return;
  }
  const local=donneesPerso();
  let fin,fusion=false;
  if(uidLocal===user.uid) fin=(cloud&&(+cloud.modif||0)>(+local.modif||0))?cloud:local;
  else if(uidLocal) fin=cloud||{};
  else{fin=cloud?fusionDonnees(cloud,local):local;fusion=true;}
  if(!fin.modif) fin.modif=Date.now();
  try{localStorage.setItem(CLE+"_uid",user.uid);}catch(e){}
  appliquer(fin);
  PRET=true;
  if(fin!==cloud) await pousser();
  ecouter(user);
  SYNC="ok";majCompteBar();
  if(COMPTE_OUVERT){fermerCompte();toast(fusion?"✅ Connecté ! Tes données sont dans ton compte ☁️":"✅ Connecté !");}
}

/* ===================== 💬 COMMENTAIRES ===================== */
function getComs(key){
  const parts=key.split(":");
  if(parts[0]==="e") return S.eleves[parts[1]].coms;
  const num=parts[1],nom=parts.slice(2).join(":");
  const pd=primeData(num);
  if(!pd.eleves[nom]) pd.eleves[nom]={note:0,coms:[]};
  if(!Array.isArray(pd.eleves[nom].coms)) pd.eleves[nom].coms=[];
  return pd.eleves[nom].coms;
}
function tousComs(nom){
  const L=[];
  (S.eleves[nom].coms||[]).forEach((c,i)=>L.push({key:"e:"+nom,i,c,p:+c.prime||1}));
  Object.keys(S.primes).forEach(k=>{
    if(!/^\d+$/.test(k)) return;
    const pe=S.primes[k].eleves&&S.primes[k].eleves[nom];
    if(pe&&Array.isArray(pe.coms)) pe.coms.forEach((c,i)=>L.push({key:"p:"+k+":"+nom,i,c,p:+k}));
  });
  return L;
}
function addCom(key,t,prime){getComs(key).push({t,d:new Date().toISOString(),prime});save();}
function ajouterCom(nom){
  const ta=$("#fcTxt"),sel=$("#fcPrime");

}
function editCom(key,i){

  else{c.t=v.trim();c.m=new Date().toISOString();}

function delCom(key,i){
  const arr=getComs(key); if(!arr[i]) return;
  if(!confirm("🗑️ Supprimer ce commentaire ?")) return;

function moveCom(key,i){
  const arr=getComs(key),c=arr[i]; if(!c) return;
  const parts=key.split(":"),max=CALv().length;
  const cur=parts[0]==="e"?(+c.prime||1):+parts[1];
  const v=prompt("🔁 Ce commentaire concerne quel prime ? (de 1 à "+max+")",cur);
  if(v===null) return;
  const n=parseInt(v,10);
  if(!(n>=1&&n<=max)){alert("Numéro de prime invalide 😕");return;}
  if(parts[0]==="e") c.prime=n;
  else if(n!==cur){arr.splice(i,1);c.prime=n;getComs("p:"+n+":"+parts.slice(2).join(":")).push(c);}
  save();refresh();toast("🔁 Rangé dans le prime "+n);
}
function timeline(nom){
  const L=tousComs(nom);
  if(!L.length) return `<p class="mut">Pas encore de commentaire sur ${nom}. Écris le premier ! ✍️</p>`;
  const G={};
  L.forEach(x=>{(G[x.p]=G[x.p]||[]).push(x);});
  const nums=Object.keys(G).map(Number).sort((a,b)=>a-b);
  if(ORDRE_COMS==="desc") nums.reverse();
  const cal=CALv();
  let h=`<div class="tlbar"><b>📜 Tout l’historique (${L.length})</b><button class="btn sec petit" onclick="ORDRE_COMS=(ORDRE_COMS==='asc'?'desc':'asc');refresh()">${ORDRE_COMS==="asc"?"⬇️ Du plus ancien au plus récent":"⬆️ Du plus récent au plus ancien"}</button></div><div class="tl">`;
  nums.forEach(n=>{
    const g=G[n].sort((a,b)=>tms(a.c.d)-tms(b.c.d));
    if(ORDRE_COMS==="desc") g.reverse();
    const c=cal.find(x=>x.num===n),note=noteP(n,nom);
    h+=`<div class="tlg"><div class="tlh"><span class="pbadge">🎤 Prime ${n}</span><span class="mut sm">${c?dLongue(c):""}</span>${note?`<span class="or" title="Ma note de ce prime">${"★".repeat(note)}${"☆".repeat(5-note)}</span>`:""}</div>`;
    g.forEach(x=>{
      h+=`<div class="com"><div class="cmeta"><span class="pbadge sm">Prime ${n}</span>${x.c.d?`<span class="mut">${fDate(x.c.d)}</span>`:`<span class="mut">date inconnue</span>`}${x.c.m?`<span class="mut">· modifié</span>`:""}</div><div class="ctxt">${esc(x.c.t).replace(/\n/g,"<br>")}</div><div class="cact"><button onclick="editCom('${x.key}',${x.i})">✏️ Modifier</button><button onclick="moveCom('${x.key}',${x.i})">🔁 Changer de prime</button><button onclick="delCom('${x.key}',${x.i})">🗑️ Supprimer</button></div></div>`;
    });
    h+=`</div>`;
  });
  return h+`</div>`;
}

/* ===================== 📅 PAGE QUOTIDIENNE ===================== */
const LETTRES="A-Za-zÀ-ÖØ-öø-ÿ";
function reNom(n,g){return new RegExp("(^|[^"+LETTRES+"])("+n+")(?!["+LETTRES+"])",g||"");}
const RE_NOMS=reNom(ELEVES.join("|"),"g");
/* ✨ Rend les prénoms cliquables */
function lienNoms(t){return esc(t).replace(RE_NOMS,(m,a,n)=>a+`<span class="lien qn" onclick="event.stopPropagation();openFiche('${n}')">${n}</span>`);}
function nomsDans(t){return ELEVES.filter(n=>reNom(n).test(t));}
function dateQ(s){const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d,12);}
function jourQ(s){const t=dateQ(s),j=JOURS[t.getDay()];return j[0].toUpperCase()+j.slice(1)+" "+numJ(t.getDate())+" "+MOIS[t.getMonth()];}
function primeDeQ(s){const t=dateQ(s),cal=CALv();return (cal.find(c=>dateP(c)>t)||cal[cal.length-1]).num;}
/* 🤖 Mélange : résumés écrits à la main + data.json (clé "quotidiennes") + résumés du robot */
function joursQ(){
  const o=S.officiel||{},M={},ok=d=>/^\d{4}-\d{2}-\d{2}$/.test(String(d||""));
  QUOTIDIENNES.concat(Array.isArray(o.quotidiennes)?o.quotidiennes:[]).forEach(q=>{if(q&&ok(q.date))M[q.date]=Object.assign({},M[q.date]||{},q);});
  ((QAUTO&&Array.isArray(QAUTO.jours))?QAUTO.jours:[]).forEach(j=>{
    if(!j||!ok(j.date)) return;
    const pts=liste2(j.points);
    if(!pts.length) return;
    const m=M[j.date];
    if(!m||m.provisoire||!liste2(m.points).length) M[j.date]={date:j.date,titre:j.titre||"La quotidienne",points:pts,auto:true};
  });
  return Object.values(M).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function carteQ(q,auj){
  const pts=liste2(q.points);
  const etat=q.date>auj?`<span class="tag">⏳ à venir</span>`:(q.date===auj?`<span class="tag or">📺 aujourd’hui</span>`:`<span class="tag ok">✅ passé</span>`);
  const noms=nomsDans([q.titre||""].concat(pts).join(" "));
  let corps="";
  if(pts.length) corps+=`<ul>${pts.map(x=>`<li>${lienNoms(x)}</li>`).join("")}</ul>`;
  if(q.note) corps+=`<p class="mut sm">ℹ️ ${esc(q.note)}</p>`;
  if(!corps) corps=`<p class="mut">Pas encore d’infos.</p>`;
  return `<div class="qcard${q.date>=auj?" avenir":""}">
    <div class="qhead"><span class="qdate">📅 ${jourQ(q.date)}</span><span>${q.auto?`<span class="auto">🤖 auto</span> `:""}${etat}</span></div>
    ${q.titre?`<h3>${lienNoms(q.titre)}</h3>`:""}${corps}
    ${noms.length?`<div class="qav">${noms.map(n=>`<span class="lien" title="Voir la fiche de ${n}" onclick="openFiche('${n}')">${avatar(n,"mini")}</span>`).join("")}</div>`:""}
  </div>`;
}
function blocEvals(s){
  const ORD={top:0,mitige:1,"":2,bof:3},EMO={top:"🟢",mitige:"🟡",bof:"🔴"};
  const P=(Array.isArray(s.passages)?s.passages:[]).slice().sort((a,b)=>(ORD[a.humeur||""]??2)-(ORD[b.humeur||""]??2));
  const k="ev"+s.semaine,ouvert=OPEN[k]!==false;
  return `<details class="bloc" ${ouvert?"open":""} ontoggle="OPEN['${k}']=this.open"><summary>🎤 Évaluations semaine ${esc(s.semaine)}${s.theme?` · « ${esc(s.theme)} »`:""}</summary>

    <div class="legende"><span>🟢 Au top</span><span>🟡 Avis partagés</span><span>🔴 Difficile</span><span>⚪ Pas d’info</span></div>
    <div class="evals">${P.map(p=>{
      const el=liste2(p.eleves);if(!el.length) return "";
      return `<div class="ev ${esc(p.humeur||"")}"><span class="lien" onclick="openFiche('${el[0]}')">${avatar(el[0],"moy")}</span><div>
        <div class="evh">${el.map(n=>`<span class="lien qn" onclick="openFiche('${n}')">${esc(n)}</span>`).join(" & ")} ${EMO[p.humeur]||"⚪"}</div>
        <div class="sm">🎵 ${p.chanson?`<b>${esc(p.chanson)}</b>${p.artiste?` <span class="mut">– ${esc(p.artiste)}</span>`:""}`:`<span class="mut">chanson pas encore connue</span>`}</div>
        <div class="sm" style="margin-top:4px">💬 ${lienNoms(p.avis||"Pas encore d’info.")}</div>
        ${p.doute?`<div class="doute">⚠️ ${esc(p.doute)}</div>`:""}
      </div></div>`;}).join("")}</div>
  </details>`;

function blocDanse(g){
  const k="da"+g.semaine,ouvert=OPEN[k]!==false;
  return `<details class="bloc" ${ouvert?"open":""} ontoggle="OPEN['${k}']=this.open"><summary>💃 Groupes de danse · semaine ${esc(g.semaine)}</summary>
    ${g.info?`<div class="mut sm" style="margin-top:6px">${esc(g.info)}</div>`:""}
    <div class="groupes">${(g.groupes||[]).map(x=>`<div class="grp"><b>${esc(x.nom)}</b>${liste2(x.eleves).map(n=>`<span class="nm lien" onclick="openFiche('${n}')">${avatar(n,"mini")} ${esc(n)}</span>`).join("")}</div>`).join("")}</div>
  </details>`;

function pageQuotidienne(){
  const o=S.officiel||{},auj=isoJour(new Date());
  const Q=joursQ();
  const EV=(Array.isArray(o.evaluations)&&o.evaluations.length)?o.evaluations:EVALUATIONS;
  const GD=(Array.isArray(o.groupesDanse)&&o.groupesDanse.length)?o.groupesDanse:GROUPES_DANSE;
  const AR=((Array.isArray(o.aRetenir)&&o.aRetenir.length)?o.aRetenir:A_RETENIR).map(x=>typeof x==="string"?{t:x}:x).filter(x=>x&&x.t&&(!x.jusqu||auj<=x.jusqu)).map(x=>String(x.t));
  const V=vedette(),pv=primeInfo(V.num),dyn=[];
  if(pv.nomines.length) dyn.push("⚠️ Les nommés de la semaine : "+pv.nomines.join(", ")+".");
  if(pv.top3.length) dyn.push("🏅 Le top 3 des évaluations : "+pv.top3.join(", ")+".");
  if(pv.sauve.length) dyn.push("🙌 Sauvé(e) : "+pv.sauve.join(", ")+".");
  const tout=sansDoublons(dyn.concat(AR,retenirAuto()));
  let h=`<h2 class="titre">📅 La quotidienne</h2>
    <p class="mut sm">Tout ce qui se passe au château, en résumé simple, mis à jour tout seul 🤖 Touche un prénom ou une photo pour ouvrir la fiche.</p>
    <div class="qinfo"><span class="tag">📺 Lun → ven : 17h30</span><span class="tag">Sam : 17h15</span><span class="tag">Dim : 16h05</span><span class="tag">🔴 Le live sur TF1+</span></div>`;
  h+=`<div class="retenir"><h3>🔥 À retenir · en route vers le prime ${V.num}</h3>${tout.length?`<ul>${tout.map(x=>`<li>${lienNoms(x)}</li>`).join("")}</ul>`:`<p class="mut">Rien de spécial pour l’instant.</p>`}</div>`;
  let sem=null;
  Q.forEach(q=>{
    const p=primeDeQ(q.date);
    if(p!==sem){sem=p;h+=`<h3 class="semaine">🗓️ Semaine ${Math.max(1,p-1)} · en route vers le prime ${p}</h3>`;}
    h+=carteQ(q,auj);
  });
  if(!Q.length) h+=`<div class="vide">Pas encore de quotidienne résumée 🙂</div>`;
  h+=`<h3 class="semaine">📊 Les évaluations et la danse</h3>`;
  h+=EV.slice().sort((a,b)=>(+b.semaine||0)-(+a.semaine||0)).map(blocEvals).join("");
  h+=GD.slice().sort((a,b)=>(+b.semaine||0)-(+a.semaine||0)).map(blocDanse).join("");
  let m="";
  if(QAUTO&&QAUTO.maj){const d=new Date(QAUTO.maj);if(!isNaN(d))m=d.toLocaleString("fr-FR",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});}
  h+=`<p class="mut sm">🤖 ${m?"Résumés automatiques mis à jour : "+esc(m):"Résumés automatiques : en attente du 1er passage du robot"}</p>`;
  h+=`<p class="mut sm">ℹ️ Les infos marquées ⚠️ restent à confirmer.</p>`;
  return h;
}

  let h=`<h2 class="titre">🏆 Mon classement</h2>`;
  if(!L.length) return h+`<div class="vide">☆ Touche l’étoile d’un élève (sur sa carte ou dans sa fiche) pour l’ajouter à tes préférés : il apparaîtra ici !</div>`;
  h+=`<div class="podium">`;
  [1,0,2].forEach(i=>{const n=L[i];if(!n)return;h+=`<div class="pod p${i+1}" onclick="openFiche('${n}')">${avatar(n,"big")}<div class="nom">${["🥇","🥈","🥉"][i]} ${n}</div><div class="mut sm">${fmtMoy(moyenne(n))}</div><div class="marche">${i+1}</div></div>`;});
  h+=`</div><div class="ctrl"><span class="mut sm">⬆️⬇️ Range tes préférés comme tu veux</span><button class="btn sec" onclick="trierMoy()">📊 Trier par moyenne</button></div><div class="liste">`;
  L.forEach((n,i)=>{const b=BIOS[n]||{};h+=`<div class="row"><span class="rang">${i+1}</span><span class="lien" onclick="openFiche('${n}')">${avatar(n)}</span><div class="fl"><div class="nom lien" onclick="openFiche('${n}')">${n}${drap(b.drapeau)}</div><div class="mut sm">${fmtMoy(moyenne(n))} · 💬 ${tousComs(n).length}</div>${badge(statut(n))}</div><div class="fleches"><button ${i===0?"disabled":""} onclick="bouger(${i},-1)" aria-label="Monter">⬆️</button><button ${i===L.length-1?"disabled":""} onclick="bouger(${i},1)" aria-label="Descendre">⬇️</button></div></div>`;});
  return h+`</div>`;
}

/* ===================== 🎓 PAGE PROFS ===================== */
function pageProfs(){
  let h=`<h2 class="titre">🎬 L’équipe</h2><div class="equipe">${EQUIPE.map(([r,n])=>`<div class="eq"><span class="mut sm">${r}</span><b>${esc(n)}</b></div>`).join("")}</div>`;
  h+=`<h2 class="titre">🎓 Les profs</h2><div class="pgrid">${PROFS.map((p,i)=>{const v=S.profs[p.nom]||{note:0,avis:""};return `<div class="pcarte"><div class="cl" style="cursor:default"><span class="av" style="background:${couleur(p.nom)}">${p.e}</span><div><div class="nom">${esc(p.nom)} ${p.nouv?`<span class="new">NOUVEAU</span>`:""}</div><div class="mut sm">${esc(p.role)}</div></div></div>${etoiles(v.note,`setProfNote(${i},#)`)}<textarea id="prof${i}" placeholder="Mon avis sur ${esc(p.nom)}…" oninput="setProfAvis(${i},this.value)">${esc(v.avis)}</textarea></div>`;}).join("")}</div>`;
  return h;
}

/* ===================== 🪪 FICHE ÉLÈVE ===================== */
function parcours(nom){
  const L=[];
  CALv().forEach(c=>{
    const p=primeInfo(c.num),ev=[];
    if(has(p.immunise,nom)) ev.push("🛡️ Immunisé(e)");
    if(has(p.top3,nom)) ev.push("🏅 Top 3 des évaluations");
    if(has(p.nomines,nom)) ev.push("⚠️ Nominé(e)");
    if(has(p.sauve,nom)) ev.push("🙌 Sauvé(e)");
    if(has(p.elimine,nom)) ev.push("❌ Éliminé(e)");
    if(has(p.abandon,nom)) ev.push("🚪 Abandon");
    if(has(p.finalistes,nom)) ev.push("✨ Finaliste");
    if(has(p.gagnant,nom)) ev.push("🏆 Gagnant(e)");
    if(ev.length) L.push(`<li><span class="pbadge sm">Prime ${c.num}</span> ${ev.join(" · ")}</li>`);
  });
  return L.length?`<ul class="parc">${L.join("")}</ul>`:`<p class="mut">Rien de spécial pour l’instant.</p>`;
}
function notesFiche(nom){
  const V=vedette().num,sorti=sortiAu(nom);
  const L=CALv().filter(c=>(c.num<=V&&(!sorti||c.num<=sorti))||noteP(c.num,nom)>0);
  return `<div class="nl">${L.map(c=>{const ch=chansonsDe(nom,c.num);return `<div class="nlr2"><span class="pbadge sm">Prime ${c.num}</span><span class="mut sm">${dCourte(c)}${ch.length?" · 🎵 "+ch.map(x=>esc(x.titre)).join(" / "):""}</span>${etoiles(noteP(c.num,nom),`setPNote(${c.num},'${nom}',#)`)}</div>`;}).join("")}</div>`;
}
function renderFiche(){
  const nom=FICHE; if(!nom) return;
  const b=BIOS[nom]||{},e=S.eleves[nom],st=statut(nom),V=vedette().num,defP=FICHE_P||SEL||V;
  const chs=CALv().flatMap(c=>chansonsDe(nom,c.num).map(x=>Object.assign({num:c.num},x)));
  const opts=["","En compétition","Nominé(e)","Immunisé(e)","Sauvé(e)","Éliminé(e)","Abandon","Finaliste","Gagnant(e)"];
  if(e.statut&&!opts.includes(e.statut)) opts.push(e.statut);
  let h=`<div class="fhead">${avatarZoom(nom,"big")}<div class="fl">
      <h2>${nom}${drap(b.drapeau)}</h2>
      <div class="mut">${esc(b.nom||"")}</div>
      <div>🎂 ${b.age||"?"} ans · 📍 ${esc(b.ville||"")}${b.region?" ("+esc(b.region)+")":""}</div>
      <div class="row2">${badge(st)}<button class="chip${e.fav?" on":""}" onclick="toggleFav('${nom}')">${e.fav?"⭐ Dans mes préférés":"☆ Ajouter à mes préférés"}</button></div>
      <div class="mut sm" style="margin-top:6px">🔍 Touche la photo pour la voir en grand</div>
    </div></div>`;
  if(b.faits&&b.faits.length) h+=`<ul class="faits">${b.faits.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`;
  h+=`<section class="fsec" id="secComs"><h3>${avatarZoom(nom,"moy")}<span>💬 Mes commentaires sur ${nom}</span></h3>
    <div class="addcom">
      <label class="sm">Ce commentaire concerne :
        <select id="fcPrime" data-keep>${CALv().map(c=>`<option value="${c.num}" ${c.num===defP?"selected":""}>Prime ${c.num} · ${dCourte(c)}${c.num===V?" (en ce moment)":""}</option>`).join("")}</select></label>
      <textarea id="fcTxt" data-keep placeholder="Écris ce que tu as pensé de ${nom} (prestation, quotidienne, progrès…)"></textarea>
      <button class="btn" onclick="ajouterCom('${nom}')">➕ Ajouter le commentaire</button>
    </div>${timeline(nom)}</section>`;
  h+=`<section class="fsec"><h3>⭐ Mes notes prime par prime</h3>${notesFiche(nom)}</section>`;
  h+=`<section class="fsec"><h3>🎵 Ses chansons</h3>${chs.length?`<ul class="chl">${chs.map(x=>`<li><span class="pbadge sm">Prime ${x.num}</span> <b>${esc(x.titre)}</b> <span class="mut">– ${esc(x.artiste)}${x.avec.length?" · avec "+esc(x.avec.join(", ")):""}</span></li>`).join("")}</ul>`:`<p class="mut">Pas encore de chanson connue.</p>`}</section>`;
  h+=`<section class="fsec"><h3>📋 Parcours officiel</h3>${parcours(nom)}</section>`;
  h+=`<section class="fsec"><h3>🌟 Ma note générale</h3>${etoiles(e.note,`setNote('${nom}',#)`)}</section>`;
  h+=`<section class="fsec"><h3>🛠️ Réglages</h3>
    <label class="sm">Corriger le statut :
      <select onchange="setStatut('${nom}',this.value)">${opts.map(o=>`<option value="${esc(o)}" ${e.statut===o?"selected":""}>${o?esc(o):"🔄 Automatique ("+esc(statutAuto(nom))+")"}</option>`).join("")}</select></label>
    <div class="row2" style="margin-top:10px">
      <button class="btn" onclick="lienPhoto('${nom}')">🔗 Coller le lien d’une photo</button>
      <label class="btn sec">📷 Choisir une photo<input type="file" accept="image/*" hidden onchange="choisirPhoto('${nom}',this)"></label>
      ${S.photos[nom]?`<button class="btn sec" onclick="supprPhoto('${nom}')">🗑️ Retirer ma photo</button>`:""}
    </div>
    ${PHOTO_KO["u:"+nom]?`<p class="sm" style="color:#ffb0b0">⚠️ Le lien de la photo ne marche pas (le site d’origine la bloque peut-être). Essaie un autre lien.</p>`:""}
  </section>`;
  $("#mbody").innerHTML=h;
}
function openFiche(nom,versComs,prime){
  if(!S.eleves[nom]) return;
  FICHE=nom;FICHE_P=prime||null;
  $("#modal").hidden=false;document.body.classList.add("noscroll");
  renderFiche();
  const box=$("#mbox");box.scrollTop=0;
  if(versComs){const s=$("#secComs");if(s)box.scrollTop=s.offsetTop-10;}
}
function fermerFiche(){
  const ta=$("#fcTxt");
  if(ta&&ta.value.trim()&&!confirm("✍️ Ton commentaire n’est pas encore ajouté. Fermer quand même ?")) return;
  FICHE=null;FICHE_P=null;
  $("#modal").hidden=true;document.body.classList.remove("noscroll");$("#mbody").innerHTML="";
  refresh();
}

/* ===================== 🎛️ ACTIONS ===================== */
function toggleFav(nom){const e=S.eleves[nom];e.fav=!e.fav;syncOrdre();save();refresh();toast(e.fav?"⭐ "+nom+" ajouté(e) à tes préférés":"☆ "+nom+" retiré(e) de tes préférés");}
function setPNote(num,nom,n){const pd=primeData(num);const pe=pd.eleves[nom]=pd.eleves[nom]||{note:0,coms:[]};pe.note=(pe.note===n?0:n);save();refresh();}
function setNote(nom,n){const e=S.eleves[nom];e.note=(e.note===n?0:n);save();refresh();}
function setStatut(nom,v){S.eleves[nom].statut=v;save();refresh();toast(v?"🛠️ Statut corrigé":"🔄 Statut automatique");}
function setAvis(num,v){primeData(num).avis=v;save();}
function setBest(num,v){primeData(num).best=v;save();refresh();}
function setProfNote(i,n){const k=PROFS[i].nom;const v=S.profs[k]=S.profs[k]||{note:0,avis:""};v.note=(v.note===n?0:n);save();refresh();}
function setProfAvis(i,val){const k=PROFS[i].nom;const v=S.profs[k]=S.profs[k]||{note:0,avis:""};v.avis=val;save();}
function bouger(i,d){const j=i+d;if(j<0||j>=S.ordre.length)return;const t=S.ordre[i];S.ordre[i]=S.ordre[j];S.ordre[j]=t;save();refresh();}
function trierMoy(){S.ordre.sort((a,b)=>{const A=moyenne(a),B=moyenne(b);return (B.moy-A.moy)||(S.eleves[b].note-S.eleves[a].note);});save();refresh();toast("📊 Classement trié par moyenne");}
/* 🔗 Photo par lien (sur cet appareil) */
function lienPhoto(nom){
  const v=prompt("🔗 Colle ici l’adresse de la photo de "+nom+" (elle commence par https://)","");
  if(v===null) return;
  const u=v.trim();
  if(!/^https?:\/\/\S+$/i.test(u)){alert("😕 Ce n’est pas un lien valide. Il doit commencer par https://");return;}
  S.photos[nom]=u;delete PHOTO_KO["u:"+nom];save();refresh();toast("📸 Photo ajoutée pour "+nom);
}
function choisirPhoto(nom,inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const M=320,k=Math.min(1,M/Math.max(img.width,img.height));const w=Math.round(img.width*k),h=Math.round(img.height*k);const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);S.photos[nom]=cv.toDataURL("image/jpeg",.82);delete PHOTO_KO["u:"+nom];save();refresh();toast("📷 Photo enregistrée");};img.onerror=()=>alert("Image illisible 😕");img.src=r.result;};
  r.readAsDataURL(f);inp.value="";
}
function supprPhoto(nom){if(!confirm("Retirer ta photo de "+nom+" ?"))return;delete S.photos[nom];delete PHOTO_KO["u:"+nom];save();refresh();}
function allerOnglet(o){ONGLET=o;try{history.replaceState(null,"","#"+o);}catch(e){}refresh();window.scrollTo(0,0);}
let TT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(TT);TT=setTimeout(()=>t.classList.remove("on"),2600);}

/* ===================== 🔁 AFFICHAGE (garde le texte en cours) ===================== */
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.o===ONGLET));
  $("#main").innerHTML=ONGLET==="primes"?pagePrimes():ONGLET==="quotidienne"?pageQuotidienne():ONGLET==="classement"?pageClassement():ONGLET==="profs"?pageProfs():pageEleves();
  majInfo();
  majCompteBar();
}
function refresh(){
  const keep={};
  document.querySelectorAll("[data-keep]").forEach(el=>{if(el.id)keep[el.id]=el.value;});
  const a=document.activeElement,aid=a&&a.id?a.id:null;
  let s1=null,s2=null;
  try{if(a&&typeof a.selectionStart==="number"){s1=a.selectionStart;s2=a.selectionEnd;}}catch(e){}
  const box=$("#mbox"),st=box?box.scrollTop:0;
  render();
  if(FICHE) renderFiche();
  Object.keys(keep).forEach(id=>{const el=document.getElementById(id);if(el)el.value=keep[id];});
  if(box) box.scrollTop=st;
  if(aid){const el=document.getElementById(aid);if(el&&el!==document.activeElement){try{el.focus({preventScroll:true});if(s1!==null&&el.setSelectionRange)el.setSelectionRange(s1,s2);}catch(e){}}}
}
/* Rafraîchit seulement si tu n'es pas en train d'écrire */
function refreshSiLibre(){
  const a=document.activeElement;
  if(!(a&&/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName))) refresh();
}

/* ===================== 🌐 MISE À JOUR AUTOMATIQUE ===================== */
function majInfo(){
  const el=$("#majInfo"); if(!el) return;
  const o=S.officiel||{}; let t="";
  if(o.maj){const d=parseD(o.maj);t=d?d.toLocaleString("fr-FR",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):String(o.maj);}
  let src="";
  if(typeof o.source==="string"&&o.source) src=/^https?:\/\//.test(o.source)?` · <a href="${esc(o.source)}" target="_blank" rel="noopener">source</a>`:" · "+esc(o.source);
  el.innerHTML=(ETAT_MAJ==="hors"?"📴 Infos officielles injoignables pour l’instant (je garde les dernières). ":"")+(t?"🔄 Infos officielles mises à jour : "+esc(t):"🔄 Infos officielles : en attente de la 1re mise à jour automatique")+src;
}
async function majAuto(){
  const sansMaj=o=>JSON.stringify(Object.assign({},o||{},{maj:0}));
  for(const url of [RAW_URL,"data.json"]){
    try{
      const r=await fetch(url+"?t="+Date.now(),{cache:"no-store"});
      if(!r.ok) continue;
      const d=await r.json();
      if(!d||typeof d!=="object"||Array.isArray(d)) continue;
      ETAT_MAJ="ok";
      const premier=!S.officiel||!Object.keys(S.officiel).length;
      const change=sansMaj(S.officiel)!==sansMaj(d);
      S.officiel=d;ecrire();
      if(change){if(!SEL_MANUEL)SEL=vedette().num;refresh();if(!premier)toast("🔄 Nouvelles infos officielles !");}
      else majInfo();
      return;
    }catch(e){}
  }
  ETAT_MAJ="hors";majInfo();
}
/* 📅 Les résumés automatiques de la quotidienne (quotidienne.json, écrit par le robot) */
async function majQuot(){
  const resume=d=>JSON.stringify([(d&&d.jours||[]).map(j=>[j.date,j.titre,j.points]),d&&d.aRetenir]);
  for(const url of [QUOT_URL,"quotidienne.json"]){
    try{
      const r=await fetch(url+"?t="+Date.now(),{cache:"no-store"});
      if(!r.ok) continue;
      const d=await r.json();
      if(!d||!Array.isArray(d.jours)) continue;
      const premier=!QAUTO;
      const change=resume(d)!==resume(QAUTO);
      QAUTO=d;
      try{localStorage.setItem(CLE+"_quot",JSON.stringify(d));}catch(e){}
      if(change){
        if(!FICHE) refreshSiLibre();
        if(!premier) toast("📅 Nouvelles infos de la quotidienne !");
      }
      return;
    }catch(e){}
  }
}

/* ===================== 🚀 DÉMARRAGE ===================== */
try{S=JSON.parse(localStorage.getItem(CLE)||"null");}catch(e){S=null;}
migrer();ecrire();
SEL=vedette().num;
render();
demarrerComptes();
majAuto();
majQuot();
setInterval(majAuto,5*60*1000);
setInterval(majQuot,10*60*1000);
/* 📲 Quand tu reviens sur le site (onglet ou appli), il va chercher les nouveautés tout de suite */
let DERNIER_RETOUR=0;
function auRetour(){
  if(document.hidden) return;
  const t=Date.now();
  if(t-DERNIER_RETOUR<30*1000) return;
  DERNIER_RETOUR=t;
  majAuto();majQuot();
  if(UTIL&&PRET&&SYNC==="err") pousser();
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){if(ENVOI_T&&UTIL&&PRET)pousser();}
  else auRetour();
});
window.addEventListener("focus",auRetour);
window.addEventListener("pageshow",e=>{if(e.persisted)auRetour();});
window.addEventListener("pagehide",()=>{if(ENVOI_T&&UTIL&&PRET)pousser();});
setInterval(()=>{
  if(!SEL_MANUEL) SEL=vedette().num;
  const a=document.activeElement;
  const occupe=a&&/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName);
  if(!occupe&&!FICHE&&ONGLET==="eleves") refresh();
},60*1000);
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(!$("#zoom").hidden){fermerZoom();return;}
  if(COMPTE_OUVERT){fermerCompte();return;}
  if(FICHE) fermerFiche();
});
</script>
