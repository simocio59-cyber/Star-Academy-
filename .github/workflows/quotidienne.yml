name: 📅 Quotidienne auto

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: quotidienne-auto
  cancel-in-progress: false

jobs:
  resumes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Écrire les résumés (IA GitHub)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/maj_quotidienne.py

      - name: Enregistrer s'il y a du nouveau
        run: |
          git config user.name "robot-quotidienne"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotidienne.json || true
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "📅 Résumés quotidienne auto"
            git pull --rebase origin main
            git push origin main
          fi
