name: 📅 Quotidienne auto

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-quotidienne
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📰 Récupérer les articles
        run: python scripts/maj_quotidienne.py

      - name: 💾 Enregistrer
        run: |
          git config user.name "robot-quotidienne"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotidienne.json
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "📅 Quotidienne auto"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
