name: Mise à jour Star Ac

on:
  schedule:
    - cron: "0 */2 * * *"
    - cron: "*/15 17-23 * * 6"
    - cron: "*/15 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maj-star-ac
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: pip install requests beautifulsoup4
      - name: Lire Wikipédia
        run: python scripts/maj_wikipedia.py
      - name: Enregistrer data.json
        run: |
          git config user.name "robot-star-ac"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Rien de neuf"
          else
            git commit -m "🔄 Mise à jour auto"
            git pull --rebase
            git push
          fi
